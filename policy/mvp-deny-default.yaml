# Atom MVP policy stub. Deny-by-default network.
#
# Schema:
#   https://docs.nvidia.com/openshell/how-it-works/policies/schema
# Default policy (no network rules means all outbound network is denied):
#   https://docs.nvidia.com/openshell/how-it-works/policies/default-policy
# Apply at create time (filesystem and Landlock are startup-only):
#   openshell sandbox create --name atom-mvp --policy policy/mvp-deny-default.yaml
#   https://docs.nvidia.com/openshell/how-it-works/policies/manage-policies
#
# This file intentionally has no `network_policies` entries. That is the
# same stance as OpenShell's restrictive default: nothing is allowlisted,
# so egress is denied. Attached providers can still add rules to the
# effective policy; this stub does not attach any.
#
# Do not put API keys in this file.

version: 1

filesystem_policy:
  include_workdir: true
  # Paths match the documented default filesystem set.
  read_only:
    - /bin
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /var/log
  read_write:
    - /tmp
    - /dev/null
    # Desktop extras. Landlock compatibility is best_effort, so a missing
    # path is skipped. TODO: confirm on the first sandbox boot that Xvfb
    # can create /tmp/.X11-unix and that the agent home is writable.
    # https://docs.nvidia.com/openshell/how-it-works/policies/schema
    - /dev/shm
    - /home/agent

landlock:
  compatibility: best_effort

# `process` is omitted. Docker and Podman then use the image USER
# (agent, uid 1000). An explicit run_as_user must be the string "sandbox"
# or a numeric uid, not a username.
# https://docs.nvidia.com/openshell/how-it-works/policies/schema

